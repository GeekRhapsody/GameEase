[workspace]
members = [
    "crates/gameease-core",
    "crates/gameease-linux",
    "crates/gameease-windows",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
evdev = "0.12.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
