[package]
name = "gameease"
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace]
resolver = "2"

[dependencies]
anyhow = "1"
evdev = "0.12.2"
gtk4 = "0.11"
gtk4-layer-shell = "0.8"
gilrs = "0.11"
libpulse-binding = "2"
libpulse-glib-binding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uinput = "0.1"
xkbcommon = { version = "0.9", default-features = false }
zbus = { version = "4", features = ["tokio"] }
ksni = { version = "0.3.4", default-features = false, features = ["blocking", "tokio"] }
