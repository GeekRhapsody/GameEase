name: CI/CD

on:
  push:
    branches:
      - "**"
    tags:
      - "v*.*.*"
  pull_request:

env:
  CARGO_TERM_COLOR: always
  GTK4_LAYER_SHELL_VERSION: v1.0.4

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libgtk-4-dev \
            libpulse-dev \
            libudev-dev \
            libxkbcommon-dev \
            pkg-config \
            libx11-dev

      - name: Check formatting
        run: cargo fmt --check

      - name: Build debug
        run: cargo build --locked

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            dpkg-dev \
            file \
            git \
            libgtk-4-dev \
            libpulse-dev \
            libudev-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libx11-dev \
            meson \
            ninja-build \
            pkg-config \
            wayland-protocols

      - name: Build GTK4 layer shell
        run: |
          set -euo pipefail

          git clone --depth 1 --branch "${GTK4_LAYER_SHELL_VERSION}" \
            https://github.com/wmww/gtk4-layer-shell.git /tmp/gtk4-layer-shell
          meson setup /tmp/gtk4-layer-shell/build /tmp/gtk4-layer-shell \
            --prefix=/usr \
            -Dexamples=false \
            -Ddocs=false \
            -Dtests=false \
            -Dintrospection=false \
            -Dvapi=false
          ninja -C /tmp/gtk4-layer-shell/build
          sudo ninja -C /tmp/gtk4-layer-shell/build install
          sudo ldconfig
          pkg-config --modversion gtk4-layer-shell-0

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package release assets
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          package="gameease-${TAG_NAME}-linux-x86_64"
          deb_version="${TAG_NAME#v}"
          deb_package="gameease_${deb_version}_amd64"
          deb_root="target/package/${deb_package}"
          appimage_name="GameEase-${TAG_NAME}-x86_64.AppImage"
          appdir="target/appimage/GameEase.AppDir"
          mkdir -p "target/package/${package}"

          install -Dm755 target/release/gameease "target/package/${package}/gameease"
          install -Dm644 README.md "target/package/${package}/README.md"
          cp -a dist "target/package/${package}/dist"

          tar -C target/package -czf "target/package/${package}.tar.gz" "${package}"
          sha256sum "target/package/${package}.tar.gz" > "target/package/${package}.tar.gz.sha256"

          rm -rf "${deb_root}"
          mkdir -p "${deb_root}/DEBIAN" "${deb_root}/usr/lib/x86_64-linux-gnu"
          install -Dm755 target/release/gameease "${deb_root}/usr/bin/gameease"
          install -Dm644 README.md "${deb_root}/usr/share/doc/gameease/README.md"
          install -Dm644 dist/99-gameease.rules "${deb_root}/etc/udev/rules.d/99-gameease.rules"
          install -Dm644 dist/gameease.service "${deb_root}/usr/lib/systemd/user/gameease.service"
          sed -i 's#/usr/local/bin/gameease#/usr/bin/gameease#' \
            "${deb_root}/usr/lib/systemd/user/gameease.service"
          gtk_layer_shell_libdir="$(pkg-config --variable=libdir gtk4-layer-shell-0)"
          cp -a "${gtk_layer_shell_libdir}"/libgtk4-layer-shell.so.* \
            "${deb_root}/usr/lib/x86_64-linux-gnu/"

          cat > "${deb_root}/DEBIAN/control" <<EOF
          Package: gameease
          Version: ${deb_version}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: GameEase maintainers
          Depends: libc6, libgtk-4-1, libpulse0, libudev1, libxkbcommon0, network-manager, bluez
          Description: Gamepad-first Wayland overlay
           GameEase provides an on-screen keyboard, side menu, desktop mode,
           and system controls for gamepad-first Linux desktop use.
          EOF

          cat > "${deb_root}/DEBIAN/postinst" <<'EOF'
          #!/usr/bin/env sh
          set -e

          if command -v udevadm >/dev/null 2>&1; then
              udevadm control --reload || true
              udevadm trigger --subsystem-match=misc --attr-match=name=uinput || true
          fi

          if command -v ldconfig >/dev/null 2>&1; then
              ldconfig || true
          fi

          if command -v systemctl >/dev/null 2>&1; then
              systemctl --user daemon-reload >/dev/null 2>&1 || true
          fi
          EOF

          cat > "${deb_root}/DEBIAN/prerm" <<'EOF'
          #!/usr/bin/env sh
          set -e

          if command -v systemctl >/dev/null 2>&1; then
              systemctl --user disable --now gameease.service >/dev/null 2>&1 || true
          fi
          EOF

          cat > "${deb_root}/DEBIAN/postrm" <<'EOF'
          #!/usr/bin/env sh
          set -e

          if command -v udevadm >/dev/null 2>&1; then
              udevadm control --reload || true
              udevadm trigger --subsystem-match=misc --attr-match=name=uinput || true
          fi

          if command -v ldconfig >/dev/null 2>&1; then
              ldconfig || true
          fi

          if command -v systemctl >/dev/null 2>&1; then
              systemctl --user daemon-reload >/dev/null 2>&1 || true
          fi
          EOF

          chmod 755 "${deb_root}/DEBIAN/postinst" \
            "${deb_root}/DEBIAN/prerm" \
            "${deb_root}/DEBIAN/postrm"

          dpkg-deb --build --root-owner-group "${deb_root}" "target/package/${deb_package}.deb"
          sha256sum "target/package/${deb_package}.deb" > "target/package/${deb_package}.deb.sha256"

          rm -rf "${appdir}"
          install -Dm755 target/release/gameease "${appdir}/usr/bin/gameease"
          install -Dm755 dist/appimage/AppRun "${appdir}/AppRun"
          install -Dm644 dist/appimage/gameease.desktop "${appdir}/gameease.desktop"
          install -Dm644 assets/Menu.png "${appdir}/gameease.png"
          install -Dm644 assets/Menu.png \
            "${appdir}/usr/share/icons/hicolor/128x128/apps/gameease.png"
          install -Dm644 README.md "${appdir}/usr/share/doc/gameease/README.md"
          mkdir -p "${appdir}/usr/share/gameease"
          cp -a dist "${appdir}/usr/share/gameease/dist"
          mkdir -p "${appdir}/usr/lib/x86_64-linux-gnu"
          cp -a "${gtk_layer_shell_libdir}"/libgtk4-layer-shell.so.* \
            "${appdir}/usr/lib/x86_64-linux-gnu/"

          curl -L \
            -o target/appimagetool \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x target/appimagetool
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 \
            target/appimagetool "${appdir}" "target/package/${appimage_name}"
          sha256sum "target/package/${appimage_name}" > "target/package/${appimage_name}.sha256"

          install -Dm755 dist/install-appimage.sh "target/package/install-appimage.sh"
          install -Dm755 dist/uninstall-appimage.sh "target/package/uninstall-appimage.sh"
          sha256sum "target/package/install-appimage.sh" > "target/package/install-appimage.sh.sha256"
          sha256sum "target/package/uninstall-appimage.sh" > "target/package/uninstall-appimage.sh.sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          package="gameease-${TAG_NAME}-linux-x86_64"
          assets=(
            "target/package/${package}.tar.gz"
            "target/package/${package}.tar.gz.sha256"
            "target/package/gameease_${TAG_NAME#v}_amd64.deb"
            "target/package/gameease_${TAG_NAME#v}_amd64.deb.sha256"
            "target/package/GameEase-${TAG_NAME}-x86_64.AppImage"
            "target/package/GameEase-${TAG_NAME}-x86_64.AppImage.sha256"
            "target/package/install-appimage.sh"
            "target/package/install-appimage.sh.sha256"
            "target/package/uninstall-appimage.sh"
            "target/package/uninstall-appimage.sh.sha256"
          )

          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release upload "${TAG_NAME}" "${assets[@]}" --clobber
          else
            gh release create "${TAG_NAME}" "${assets[@]}" \
              --title "GameEase ${TAG_NAME}" \
              --generate-notes
          fi
